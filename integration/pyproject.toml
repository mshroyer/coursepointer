[project]
name = "integration"
version = "0.1.0"
description = "Integration tests for coursepointer"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fitdecode>=0.10.0",
    # 21.178.0 and earlier decode a field set to the profile's invalid value as
    # though it held real data, which these tests rely on not happening.
    "garmin-fit-sdk>=21.208.0",
    "pint>=0.24.4",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.3.5",
]

# So our tests can resolve the integration package
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
